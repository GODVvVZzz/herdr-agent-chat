<svg width="960" height="430" viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fd6be"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9e64"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa2f7"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="428" rx="14" fill="#16161e" stroke="#2a2b3d" stroke-width="1.5"/>

  <!-- main session -->
  <rect x="50" y="120" width="230" height="115" rx="10" fill="#1a1c28" stroke="#4fd6be" stroke-width="1.5"/>
  <text x="165" y="163" fill="#4fd6be" text-anchor="middle" font-size="17" font-weight="bold">main session</text>
  <text x="165" y="188" fill="#9aa5ce" text-anchor="middle" font-size="12">the agent you talk to</text>
  <text x="165" y="210" fill="#565f89" text-anchor="middle" font-size="11">claude code · herdr pane</text>

  <!-- workers -->
  <rect x="655" y="55" width="255" height="88" rx="10" fill="#1a1c28" stroke="#ff9e64" stroke-width="1.5"/>
  <text x="782" y="92" fill="#ff9e64" text-anchor="middle" font-size="15" font-weight="bold">worker · sc-a</text>
  <text x="782" y="116" fill="#9aa5ce" text-anchor="middle" font-size="11">permission-free · visible pane</text>
  <rect x="655" y="165" width="255" height="88" rx="10" fill="#1a1c28" stroke="#ff9e64" stroke-width="1.5"/>
  <text x="782" y="202" fill="#ff9e64" text-anchor="middle" font-size="15" font-weight="bold">worker · sc-b</text>
  <text x="782" y="226" fill="#9aa5ce" text-anchor="middle" font-size="11">parallel · any agent kind</text>

  <!-- task / report arrows -->
  <line x1="280" y1="145" x2="648" y2="95" stroke="#4fd6be" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <text x="452" y="98" fill="#4fd6be" text-anchor="middle" font-size="12">task · herdr agent prompt</text>
  <line x1="650" y1="230" x2="285" y2="195" stroke="#ff9e64" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="455" y="242" fill="#ff9e64" text-anchor="middle" font-size="12">report · [agent-chat] + result file</text>

  <!-- guardian -->
  <rect x="330" y="318" width="310" height="76" rx="10" fill="#1a1c28" stroke="#7aa2f7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="485" y="349" fill="#7aa2f7" text-anchor="middle" font-size="15" font-weight="bold">guardian plugin</text>
  <text x="485" y="372" fill="#9aa5ce" text-anchor="middle" font-size="11">event-driven · blocked / dead / unanswered → delivered</text>

  <!-- guardian dashed links -->
  <line x1="705" y1="253" x2="565" y2="318" stroke="#7aa2f7" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-blue)"/>
  <text x="675" y="300" fill="#7aa2f7" text-anchor="middle" font-size="11">pane events</text>
  <line x1="395" y1="318" x2="235" y2="240" stroke="#7aa2f7" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-blue)"/>
  <text x="270" y="292" fill="#7aa2f7" text-anchor="middle" font-size="11">deliver · toast</text>

  <!-- caption -->
  <text x="480" y="418" fill="#565f89" text-anchor="middle" font-size="12">agents act → the protocol drives them · agents can't → the guardian takes over</text>
</svg>
